spring.application.name=Personal-Profile-API
db.username=sbs_app
db.password=sbs_app
server.port=8081
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=PersonalProfileAPI;encrypt=true;trustServerCertificate=true;
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false
spring.security.user.name=admin
spring.security.user.password=admin
logging.level.org.springframework.security=DEBUG
jwt.secret=ThisIsA32ByteLongSecretKeyForJWTs!!!
jwt.expiration=3600000