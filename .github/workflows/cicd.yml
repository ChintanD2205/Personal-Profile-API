name: CICD

on: 
  push:
    branches: [deploy-ec2]

jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Project
        working-directory: ./backend
        run: mvn clean install
      - name: Login to DockerHub
        run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}
      - name: Build Docker Image
        run: docker build -t chintand2205/personal-profile-api:${{ github.sha }} .
      - name: Publish image to DockerHub
        run: docker push chintand2205/personal-profile-api:${{ github.sha }}

  deploy:
    needs: build
    runs-on: [aws-ec2]
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
      - name: Pull Image from DockerHub
        run: sudo docker pull chintand2205/personal-profile-api:${{ github.sha }}
      - name: Stop existing services
        run: sudo docker-compose down || true
      - name: Start services with docker-compose
        run: sudo IMAGE_TAG=${{ github.sha }} docker-compose up -d